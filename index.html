<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Galgalim - Tzeruf Combinatorio</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --wheel-border: #333333;
            --wheel-inactive: #b5b5b5;
        }

        body.dark-mode {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
            --wheel-border: #cccccc;
            --wheel-inactive: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 20px;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            font-weight: 400;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-top: 4px;
        }

        .menu-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        /* Menú desplegable */
        .menu-modal {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            min-width: 180px;
        }

        .menu-modal.open {
            display: flex;
        }

        .menu-option {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-align: left;
            text-transform: uppercase;
        }

        .menu-option:active {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* Contenedor de Ruedas */
        .wheels-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
        }

        .pointer {
            position: absolute;
            top: 5px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid var(--text-color);
            z-index: 10;
        }

        .wheel {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--wheel-border);
            transition: transform 0.5s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .wheel-outer { width: 300px; height: 300px; }
        .wheel-middle { width: 200px; height: 200px; }
        .wheel-inner { width: 110px; height: 110px; border: none; }

        .letter {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 300;
            transform-origin: center;
            color: var(--wheel-inactive);
        }

        .wheel-outer .letter { font-size: 1.3rem; }
        .wheel-middle .letter { font-size: 1.1rem; }
        .wheel-inner .letter { font-size: 0.95rem; }

        .letter.active {
            color: var(--text-color);
            font-weight: 600;
        }

        /* Panel inferior */
        .footer-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .separator-dots {
            letter-spacing: 0.5em;
            font-size: 0.8rem;
            opacity: 0.4;
        }

        .gematria-display {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
        }

        .info-box {
            width: 100%;
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn {
            width: 100%;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 15px;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 600;
        }

        .action-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galgalim</h1>
        <div class="subtitle">Tzeruf Combinatorio</div>
        <button class="menu-btn" onclick="toggleMenu()">≡</button>
        
        <div class="menu-modal" id="menuModal">
            <button class="menu-option" onclick="toggleDarkMode()">Modo Oscuro</button>
            <button class="menu-option" onclick="resetWheels()">Centrar Ruedas</button>
        </div>
    </header>

    <div class="wheels-container">
        <div class="pointer"></div>
        
        <!-- Rueda Exterior (22 letras) -->
        <div class="wheel wheel-outer" id="outerWheel"></div>
        
        <!-- Rueda Media (22 letras) -->
        <div class="wheel wheel-middle" id="middleWheel"></div>
        
        <!-- Rueda Interior (22 letras) -->
        <div class="wheel wheel-inner" id="innerWheel"></div>
    </div>

    <div class="footer-panel">
        <div class="separator-dots">- - -</div>
        <div class="gematria-display" id="gematriaDisplay">Gematria: --</div>
        <div class="info-box" id="infoBox">Gira las ruedas para invocar la combinación y su arquetipo.</div>
        <button class="action-btn" onclick="spinWheels()">Girar Ruedas</button>
    </div>

    <script>
        // Alfabeto hebreo tradicional en orden (con valores de Gematria estándar)
        const alphabet = [
            { char: 'א', val: 1 }, { char: 'ב', val: 2 }, { char: 'ג', val: 3 }, { char: 'ד', val: 4 },
            { char: 'ה', val: 5 }, { char: 'ו', val: 6 }, { char: 'ז', val: 7 }, { char: 'ח', val: 8 },
            { char: 'ט', val: 9 }, { char: 'י', val: 10 }, { char: 'כ', val: 20 }, { char: 'ל', val: 30 },
            { char: 'מ', val: 40 }, { char: 'נ', val: 50 }, { char: 'ס', val: 60 }, { char: 'ע', val: 70 },
            { char: 'פ', val: 80 }, { char: 'צ', val: 90 }, { char: 'ק', val: 100 }, { char: 'ר', val: 200 },
            { char: 'ש', val: 300 }, { char: 'ת', val: 400 }
        ];

        let outerAngle = 0;
        let middleAngle = 0;
        let innerAngle = 0;

        const outerWheel = document.getElementById('outerWheel');
        const middleWheel = document.getElementById('middleWheel');
        const innerWheel = document.getElementById('innerWheel');
        const gematriaDisplay = document.getElementById('gematriaDisplay');
        const infoBox = document.getElementById('infoBox');
        const menuModal = document.getElementById('menuModal');

        function createWheelElements(wheelElement, radius) {
            const total = alphabet.length;
            alphabet.forEach((item, index) => {
                const angle = (index * 360) / total;
                const span = document.createElement('span');
                span.className = 'letter';
                span.innerText = item.char;
                span.dataset.val = item.val;
                span.dataset.index = index;
                // Posicionamiento circular trigonométrico
                span.style.transform = `rotate(${angle}deg) translate(0, -${radius}px) rotate(-${angle}deg)`;
                wheelElement.appendChild(span);
            });
        }

        createWheelElements(outerWheel, 125);
        createWheelElements(middleWheel, 80);
        createWheelElements(innerWheel, 42);

        function toggleMenu() {
            menuModal.classList.toggle('open');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            toggleMenu();
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(12); // Vibración háptica sutil
            }
        }

        function updateState() {
            triggerHaptic();

            // Calcular índices activos basados en el ángulo actual (hacia arriba, 0 grados)
            const total = alphabet.length;
            
            const outerIndex = (Math.round((-outerAngle / (360 / total))) % total + total) % total;
            const middleIndex = (Math.round((-middleAngle / (360 / total))) % total + total) % total;
            const innerIndex = (Math.round((-innerAngle / (360 / total))) % total + total) % total;

            // Actualizar clases visuales de letras activas en el ápice superior
            updateActiveLetters(outerWheel, outerIndex);
            updateActiveLetters(middleWheel, middleIndex);
            updateActiveLetters(innerWheel, innerIndex);

            // Calcular Gematria en tiempo real
            const v1 = alphabet[outerIndex].val;
            const v2 = alphabet[middleIndex].val;
            const v3 = alphabet[innerIndex].val;
            const totalGematria = v1 + v2 + v3;

            const c1 = alphabet[outerIndex].char;
            const c2 = alphabet[middleIndex].char;
            const c3 = alphabet[innerIndex].char;

            gematriaDisplay.innerText = `Gematria: ${totalGematria} (${c1} · ${c2} · ${c3})`;
            
            // Arquetipo dinámico simple basado en valor
            updateArchetype(totalGematria);
        }

        function updateActiveLetters(wheel, activeIdx) {
            const letters = wheel.querySelectorAll('.letter');
            letters.forEach((el, idx) => {
                if (idx === activeIdx) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function updateArchetype(sum) {
            let desc = "Permutación equilibrada de fuerzas primordiales.";
            if (sum < 100) desc = "Umbral de emanación sutil y principios puros.";
            else if (sum >= 100 && sum < 300) desc = "Dinámica de canales intermedios y expansión activa.";
            else if (sum >= 300) desc = "Convergencia de fuegos mayores y síntesis completa.";
            infoBox.innerText = desc;
        }

        function spinWheels() {
            const step = 360 / alphabet.length;
            // Giros aleatorios limpios en múltiplos exactos de posiciones
            outerAngle += (Math.floor(Math.random() * 8) + 4) * step * (Math.random() > 0.5 ? 1 : -1);
            middleAngle += (Math.floor(Math.random() * 10) + 5) * step * (Math.random() > 0.5 ? 1 : -1);
            innerAngle += (Math.floor(Math.random() * 12) + 6) * step * (Math.random() > 0.5 ? 1 : -1);

            outerWheel.style.transform = `rotate(${outerAngle}deg)`;
            middleWheel.style.transform = `rotate(${middleAngle}deg)`;
            innerWheel.style.transform = `rotate(${innerAngle}deg)`;

            setTimeout(updateState, 500); // Sincroniza el cálculo al terminar la transición visual
        }

        function resetWheels() {
            outerAngle = 0;
            middleAngle = 0;
            innerAngle = 0;
            outerWheel.style.transform = `rotate(0deg)`;
            middleWheel.style.transform = `rotate(0deg)`;
            innerWheel.style.transform = `rotate(0deg)`;
            updateState();
            toggleMenu();
        }

        // Inicialización al cargar
        updateState();
    </script>
</body>
</html>
