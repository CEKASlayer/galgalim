<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Galgalim - Tzeruf Combinatorio Extático</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --wheel-border: #333333;
            --wheel-inactive: #b5b5b5;
        }

        body.dark-mode {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
            --wheel-border: #cccccc;
            --wheel-inactive: #555555;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding: 20px;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            font-weight: 400;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-top: 4px;
        }

        .menu-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }

        .menu-modal {
            position: absolute;
            top: 50px;
            right: 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            min-width: 180px;
        }

        .menu-modal.open {
            display: flex;
        }

        .menu-option {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-align: left;
            text-transform: uppercase;
        }

        .menu-option:active {
            background: var(--text-color);
            color: var(--bg-color);
        }

        .wheels-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto 0;
        }

        .pointer {
            position: absolute;
            top: 5px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid var(--text-color);
            z-index: 10;
        }

        .wheel {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--wheel-border);
        }

        .wheel-outer { width: 300px; height: 300px; }
        .wheel-middle { width: 200px; height: 200px; }
        .wheel-inner { width: 110px; height: 110px; border: none; }

        .letter {
            position: absolute;
            font-size: 1.2rem;
            font-weight: 300;
            transform-origin: center;
            color: var(--wheel-inactive);
        }

        .wheel-outer .letter { font-size: 1.3rem; }
        .wheel-middle .letter { font-size: 1.1rem; }
        .wheel-inner .letter { font-size: 0.95rem; }

        .letter.active {
            color: var(--text-color);
            font-weight: 600;
        }

        .footer-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .separator-dots {
            letter-spacing: 0.5em;
            font-size: 0.8rem;
            opacity: 0.4;
        }

        .gematria-display {
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            direction: ltr;
        }

        .info-box {
            width: 100%;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            min-height: 72px;
            max-height: 180px;
            overflow-y: hidden;
            transition: max-height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
            position: relative;
            background: var(--bg-color);
            display: flex;
            align-items: center;
        }

        .info-box.expanded {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            align-items: flex-start;
        }

        .info-content-wrapper {
            position: relative;
            width: 100%;
        }

        .info-basic {
            width: 100%;
            text-align: center;
            transition: opacity 0.2s ease-in-out;
            opacity: 1;
        }

        .info-box.expanded .info-basic {
            opacity: 0;
            height: 0;
            overflow: hidden;
            pointer-events: none;
            margin: 0;
        }

        .info-summary {
            font-weight: 500;
            display: block;
        }

        .expand-hint {
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.5;
            display: block;
            margin-top: 4px;
        }

        .info-details {
            display: none;
            width: 100%;
            text-align: left;
            font-size: 0.73rem;
            line-height: 1.5;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .info-box.expanded .info-details {
            display: block;
            opacity: 0.95;
        }

        .action-btn {
            width: 100%;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 15px;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            font-weight: 600;
        }

        .action-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galgalim</h1>
        <div class="subtitle">Tzeruf Combinatorio</div>
        <button class="menu-btn" onclick="toggleMenu()">≡</button>
        
        <div class="menu-modal" id="menuModal">
            <button class="menu-option" onclick="toggleDarkMode()">Modo Alternativo</button>
            <button class="menu-option" onclick="resetWheels()">Centrar Ruedas</button>
        </div>
    </header>

    <div class="wheels-container">
        <div class="pointer"></div>
        <div class="wheel wheel-outer" id="outerWheel"></div>
        <div class="wheel wheel-middle" id="middleWheel"></div>
        <div class="wheel wheel-inner" id="innerWheel"></div>
    </div>

    <div class="footer-panel">
        <div class="separator-dots">- - -</div>
        <div class="gematria-display" id="gematriaDisplay">Gematria: --</div>
        
        <div class="info-box" id="infoBox" onclick="toggleInfoBox()">
            <div class="info-content-wrapper">
                <div class="info-basic" id="infoBasic">
                    <span class="info-summary" id="infoSummary">Gira las ruedas para invocar la combinación.</span>
                    <span class="expand-hint">▼ Toca para desplegar la enseñanza del Tzeruf</span>
                </div>
                <div class="info-details" id="infoDetails"></div>
            </div>
        </div>

        <button class="action-btn" onclick="spinWheels()">Girar Ruedas</button>
    </div>

    <script>
        const alphabet = [
            { char: 'א', val: 1, type: 'Madre', element: 'Aire', arcana: 'El aliento primordial y el origen sin dimensiones.', action: 'inicia la emanación descompresión del vacío', sefira: 'Keter / Hokhmah', axiom: 'vaciar la mente de formas finitas para recibir el aliento inextinguible' },
            { char: 'ב', val: 2, type: 'Doble', element: 'Saturno / Planeta', arcana: 'La morada (Bayit), la dualidad y la estructura.', action: 'edifica el receptáculo físico del pensamiento', sefira: 'Binah', axiom: 'construir la morada sutil donde la luz pueda residir sin cegar' },
            { char: 'ג', val: 3, type: 'Doble', element: 'Júpiter / Planeta', arcana: 'El puente dinámico y la abundancia desbordante.', action: 'proyecta la gracia a través del vacío', sefira: 'Hesed', axiom: 'tender puentes de compasión entre los mundos dispares' },
            { char: 'ד', val: 4, type: 'Doble', element: 'Marte / Planeta', arcana: 'La puerta, el umbral y la humildad receptiva.', action: 'establece el umbral de disciplina y discernimiento', sefira: 'Gevurah', axiom: 'cruzar la puerta del temor sagrado hacia la claridad limpia' },
            { char: 'ה', val: 5, type: 'Simple', element: 'Aries / Zodíaco', arcana: 'El aliento articulado y la ventana de la luz.', action: 'expande el aliento vital en todas direcciones', sefira: 'Tiferet', axiom: 'permitir que la luz contemple el mundo a través de la ventana del ser' },
            { char: 'ו', val: 6, type: 'Simple', element: 'Tauro / Zodíaco', arcana: 'El gancho de unión que conecta cielo y tierra.', action: 'ancla lo superior en la sustancia de lo inferior', sefira: 'Yesod', axiom: 'fijar la intención divina en el eje central de la realidad' },
            { char: 'ז', val: 7, type: 'Simple', element: 'Géminis / Zodíaco', arcana: 'La espada del espíritu, el sustento y la corona.', action: 'discierne entre la ilusión fugaz y la verdad', sefira: 'Netzah', axiom: 'blandir la espada de la atención pura para cortar la dispersión' },
            { char: 'ח', val: 8, type: 'Simple', element: 'Cáncer / Zodíaco', arcana: 'El cercado protector y la vida interior.', action: 'resguarda la simiente divina dentro del recinto sagrado', sefira: 'Hod', axiom: 'fortalecer el cercado de la meditación para preservar el fuego' },
            { char: 'ט', val: 9, type: 'Simple', element: 'Leo / Zodíaco', arcana: 'Lo oculto, la bondad secreta y el receptáculo.', action: 'custodia la bondad oculta en las profundidades', sefira: 'Yesod / Tiferet', axiom: 'inclinarse hacia la luz interior envuelta en la oscuridad del cuerpo' },
            { char: 'י', val: 10, type: 'Simple', element: 'Virgo / Zodíaco', arcana: 'La chispa indivisible, el punto de origen.', action: 'concentra la potencia infinita en un punto fugaz', sefira: 'Hokhmah', axiom: 'reducir la totalidad al punto germinal de donde brota la creación' },
            { char: 'כ', val: 20, type: 'Doble', element: 'Sol / Planeta', arcana: 'La palma abierta que moldea y sostiene.', action: 'otorga forma y moldura a la materia fluida', sefira: 'Keter / Malkhut', axiom: 'recibir con la mano izquierda para transmitir con la derecha' },
            { char: 'ל', val: 30, type: 'Simple', element: 'Libra / Zodíaco', arcana: 'El aguijón del estudio y el ascenso contemplativo.', action: 'eleva el deseo del hombre hacia la altura celestial', sefira: 'Binah / Tiferet', axiom: 'estirar la garganta del espíritu para pronunciar los nombres inteligibles' },
            { char: 'מ', val: 40, type: 'Madre', element: 'Agua', arcana: 'Las aguas primordiales, el vientre de la sabiduría.', action: 'disuelve las durezas en la matriz del silencio', sefira: 'Hesed / Binah', axiom: 'sumergirse en las aguas que purifican la memoria temporal' },
            { char: 'נ', val: 50, type: 'Simple', element: 'Escorpio / Zodíaco', arcana: 'El pez en la profundidad, el renacimiento tras la caída.', action: 'desciende al abismo para rescatar las chispas atrapadas', sefira: 'Netzah / Hod', axiom: 'confiar en el renacimiento cuando la forma exterior se derrumba' },
            { char: 'ס', val: 60, type: 'Simple', element: 'Sagitario / Zodíaco', arcana: 'El círculo protector y el soporte inamovible.', action: 'envuelve la psique en un escudo de simetría', sefira: 'Yesod', axiom: 'descansar en la redondez del Nombre que rodea todo sufrimiento' },
            { char: 'ע', val: 70, type: 'Simple', element: 'Capricornio / Zodíaco', arcana: 'El ojo espiritual que contempla lo invisible.', action: 'descorre el velo de la materia ordinaria', sefira: 'Hokhmah / Ayin', axiom: 'mirar sin juzgar hasta que el objeto observado revele su raíz' },
            { char: 'פ', val: 80, type: 'Doble', element: 'Venus / Planeta', arcana: 'La boca creadora y el poder del Verbo.', action: 'articula los alientos internos en sonidos de fuego', sefira: 'Netzah', axiom: 'guardar la boca en silencio hasta que la palabra sea pura luz' },
            { char: 'צ', val: 90, type: 'Simple', element: 'Acuario / Zodíaco', arcana: 'El anzuelo del justo (Tzaddik) y el fundamento.', action: 'rectifica la curvatura de la intención egóica', sefira: 'Yesod / Malkhut', axiom: 'sostener el pilar del mundo mediante la rectitud de la mente' },
            { char: 'ק', val: 100, type: 'Simple', element: 'Piscis / Zodíaco', arcana: 'La santidad en lo profundo y la resonancia.', action: 'extrae la santidad del refugio de las sombras', sefira: 'Malkhut', axiom: 'reconocer la huella del Creador incluso en los lugares de exilio' },
            { char: 'ר', val: 200, type: 'Doble', element: 'Mercurio / Planeta', arcana: 'La cabeza (Rosh) y el intelecto en movimiento.', action: 'gobierna las fluctuaciones del pensamiento racional', sefira: 'Hokhmah / Binah', axiom: 'renovar la mente liberándola de las doctrinas de la costumbre' },
            { char: 'ש', val: 300, type: 'Madre', element: 'Fuego', arcana: 'El fuego devorador de la transformación.', action: 'transmuta las impurezas en ceniza espiritual', sefira: 'Gevurah / Binah', axiom: 'encender la llama tripartita de la meditación sin temor a consumirse' },
            { char: 'ת', val: 400, type: 'Doble', element: 'Luna / Planeta', arcana: 'El sello de la verdad (Emet) y la perfección del ciclo.', action: 'consuma el ciclo total de las emanaciones', sefira: 'Malkhut', axiom: 'estampar el sello de la verdad en la acción final del día' }
        ];

        let outerAngle = 0;
        let middleAngle = 0;
        let innerAngle = 0;
        let isSpinning = false;
        let isExpanded = false;

        const outerWheel = document.getElementById('outerWheel');
        const middleWheel = document.getElementById('middleWheel');
        const innerWheel = document.getElementById('innerWheel');
        const gematriaDisplay = document.getElementById('gematriaDisplay');
        const infoBox = document.getElementById('infoBox');
        const infoSummary = document.getElementById('infoSummary');
        const infoDetails = document.getElementById('infoDetails');
        const menuModal = document.getElementById('menuModal');

        // AUDIO CONTEXT GLOBAL PERSISTENTE
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function createWheelElements(wheelElement, radius) {
            const total = alphabet.length;
            alphabet.forEach((item, index) => {
                const angle = (index * 360) / total;
                const span = document.createElement('span');
                span.className = 'letter';
                span.innerText = item.char;
                span.style.transform = `rotate(${angle}deg) translate(0, -${radius}px) rotate(-${angle}deg)`;
                wheelElement.appendChild(span);
            });
        }

        createWheelElements(outerWheel, 125);
        createWheelElements(middleWheel, 80);
        createWheelElements(innerWheel, 42);

        function toggleMenu() {
            if (isSpinning) return;
            getAudioContext();
            menuModal.classList.toggle('open');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            if (menuModal.classList.contains('open')) {
                toggleMenu();
            }
        }

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            getAudioContext();
        }, { passive: true });

        document.addEventListener('touchend', e => {
            if (isSpinning) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;

            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                document.body.classList.toggle('dark-mode');
            }
        }, { passive: true });

        // SÍNTESIS DE SONIDOS
        function playIPhoneClickSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const bufferSize = ctx.sampleRate * 0.014;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 2100; 
                filter.Q.value = 1.5;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.32, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.014);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(ctx.currentTime);
            } catch (e) {}
        }

        function playResetCalibrationSound() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                [220, 440].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.05);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + idx * 0.05 + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.05 + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.05);
                    osc.stop(ctx.currentTime + idx * 0.05 + 0.3);
                });
            } catch (e) {}
        }

        function playMonumentValleyChime() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const frequencies = [261.63, 392.00, 523.25, 659.25, 783.99];
                frequencies.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = index % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.06);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + index * 0.06 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + index * 0.06 + 2.0);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + index * 0.06);
                    osc.stop(ctx.currentTime + index * 0.06 + 2.2);
                });
            } catch (e) {}
        }

        function playDynamicRouletteTicks(durationMs) {
            let elapsed = 0;
            let currentInterval = 35; 
            
            function scheduleTick() {
                if (elapsed >= durationMs) return;
                
                playIPhoneClickSound();
                if (navigator.vibrate) {
                    try { navigator.vibrate(10); } catch (e) {}
                }
                
                elapsed += currentInterval;
                currentInterval *= 1.16; // Curva de frenado
                
                if (elapsed < durationMs) { 
                    setTimeout(scheduleTick, currentInterval); 
                }
            }
            scheduleTick();
        }

        function toggleInfoBox() {
            if (isSpinning) return;
            getAudioContext();
            playIPhoneClickSound();
            isExpanded = !isExpanded;
            infoBox.classList.toggle('expanded', isExpanded);
        }

        function reduceGematria(num) {
            while (num > 9) {
                num = num.toString().split('').reduce((acc, digit) => acc + parseInt(digit), 0);
            }
            return num;
        }

        function updateState(withSound = true) {
            const total = alphabet.length;
            const slice = 360 / total;
            
            const outerIndex = (total - Math.round(outerAngle / slice) % total) % total;
            const middleIndex = (total - Math.round(middleAngle / slice) % total) % total;
            const innerIndex = (total - Math.round(innerAngle / slice) % total) % total;

            updateActiveLetters(outerWheel, outerIndex);
            updateActiveLetters(middleWheel, middleIndex);
            updateActiveLetters(innerWheel, innerIndex);

            const item1 = alphabet[outerIndex];
            const item2 = alphabet[middleIndex];
            const item3 = alphabet[innerIndex];
            
            const totalGematria = item1.val + item2.val + item3.val;

            gematriaDisplay.innerText = `Gematria: ${totalGematria} (${item1.char} · ${item2.char} · ${item3.char})`;
            
            generateAbulafianSynthesis(totalGematria, item1, item2, item3);
            
            if (withSound) {
                playMonumentValleyChime();
            }
        }

        function updateActiveLetters(wheel, activeIdx) {
            const letters = wheel.querySelectorAll('.letter');
            letters.forEach((el, idx) => {
                if (idx === activeIdx) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function generateAbulafianSynthesis(sum, l1, l2, l3) {
            const rootVal = reduceGematria(sum);
            
            let elementalDynamic = "";
            const elements = [l1.element, l2.element, l3.element].join(" ");
            
            if (elements.includes("Madre") || elements.includes("Fuego") || elements.includes("Agua") || elements.includes("Aire")) {
                elementalDynamic = `La presencia de letras Madre genera una sacudida primordial: la vibración de ${l1.char} en el manto exterior ${l1.action}, mientras la corriente media de ${l2.char} modula la potencia de ${l3.char}.`;
            } else if (l1.type === "Doble" && l2.type === "Doble") {
                elementalDynamic = `Cruce de dos puertas planetarias. La polaridad entre ${l1.char} y ${l2.char} exige un equilibrio sutil para que el asiento interior en ${l3.char} no colapse en rigidez.`;
            } else {
                elementalDynamic = `Las Ruedas Celestes de las letras Simples despliegan sus 12 senderos. La corriente de ${l1.char} viaja a través de ${l2.char} hasta fijarse en ${l3.char}.`;
            }

            let sefiraRelationship = "";
            if (l1.sefira === l3.sefira) {
                sefiraRelationship = `El principio y el fin de la tríada resuenan en la misma esfera de ${l1.sefira}, creando un bucle de contemplación directa.`;
            } else {
                sefiraRelationship = `El flujo desciende desde la canalización de ${l1.sefira}, atraviesa la estación de ${l2.sefira} y reposa en ${l3.sefira}.`;
            }

            const vowels = ["a", "e", "i", "o", "u"];
            const v1 = vowels[(l1.val + sum) % 5];
            const v2 = vowels[(l2.val + sum) % 5];
            const v3 = vowels[(l3.val + sum) % 5];
            const vocalPermutation = `${l1.char}(${v1}) - ${l2.char}(${v2}) - ${l3.char}(${v3})`;

            let summaryText = `Permutación de Raíz ${rootVal} | ${l1.type} · ${l2.type} · ${l3.type}`;
            if (sum === 26 || sum === 72 || sum === 216) {
                summaryText = `¡Alineación de Nombre Sagrado! Gematria trascendente ${sum}`;
            }

            infoSummary.innerText = summaryText;

            infoDetails.innerHTML = `
                <strong>Análisis Gematria:</strong> ${sum} (Raíz Sefirótica: ${rootVal})<br><br>
                <strong>· Exterior (${l1.char} = ${l1.val}):</strong> ${l1.type} (${l1.element}) — ${l1.arcana}<br>
                <strong>· Media (${l2.char} = ${l2.val}):</strong> ${l2.type} (${l2.element}) — ${l2.arcana}<br>
                <strong>· Interior (${l3.char} = ${l3.val}):</strong> ${l3.type} (${l3.element}) — ${l3.arcana}<br><br>
                <em>Sintaxis del Tzeruf:</em> ${elementalDynamic} ${sefiraRelationship} Para desbloquear el intelecto agente con esta clave, el místico debe ${l1.axiom}, mientras vocaliza pausadamente la secuencia <strong>${vocalPermutation}</strong> en el ritmo del aliento sagrado.
            `;
        }

        function spinWheels() {
            if (isSpinning) return;
            getAudioContext();
            isSpinning = true;
            menuModal.classList.remove('open');
            
            if (isExpanded) {
                isExpanded = false;
                infoBox.classList.remove('expanded');
            }

            const step = 360 / alphabet.length;
            const randomDuration = Math.floor(Math.random() * 1400) + 800;

            const extraRoundsOuter = (Math.floor(Math.random() * 5) + 3) * 360;
            const extraRoundsMiddle = (Math.floor(Math.random() * 6) + 4) * 360;
            const extraRoundsInner = (Math.floor(Math.random() * 7) + 5) * 360;

            outerAngle += extraRoundsOuter + (Math.floor(Math.random() * alphabet.length) * step);
            middleAngle += extraRoundsMiddle + (Math.floor(Math.random() * alphabet.length) * step);
            innerAngle += extraRoundsInner + (Math.floor(Math.random() * alphabet.length) * step);

            outerWheel.style.transition = `transform ${randomDuration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;
            middleWheel.style.transition = `transform ${randomDuration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;
            innerWheel.style.transition = `transform ${randomDuration}ms cubic-bezier(0.15, 0.85, 0.25, 1)`;

            outerWheel.style.transform = `rotate(${outerAngle}deg)`;
            middleWheel.style.transform = `rotate(${middleAngle}deg)`;
            innerWheel.style.transform = `rotate(${innerAngle}deg)`;

            playDynamicRouletteTicks(randomDuration);

            setTimeout(() => {
                updateState(true);
                isSpinning = false;
            }, randomDuration);
        }

        function resetWheels() {
            if (isSpinning) return;
            getAudioContext();
            if (navigator.vibrate) navigator.vibrate(15);
            playResetCalibrationSound();

            outerWheel.style.transition = `transform 0.5s ease-out`;
            middleWheel.style.transition = `transform 0.5s ease-out`;
            innerWheel.style.transition = `transform 0.5s ease-out`;

            outerAngle = 0;
            middleAngle = 0;
            innerAngle = 0;
            outerWheel.style.transform = `rotate(0deg)`;
            middleWheel.style.transform = `rotate(0deg)`;
            innerWheel.style.transform = `rotate(0deg)`;
            
            if (isExpanded) {
                isExpanded = false;
                infoBox.classList.remove('expanded');
            }

            updateState(false);
            menuModal.classList.remove('open');
        }

        updateState(false);
    </script>
</body>
</html>
